<!DOCTYPE html>
<html lang="en" data-density="comfortable">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>classroommaxxing v6</title>
    <meta name="title" content="classroommaxxing v6" />
    <meta name="description" content="classroommaxxing v6" />

    <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/hackz00/classroommaxxing/main/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://esm.sh" crossorigin>
    <link rel="dns-prefetch" href="//esm.sh">
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <style>


:root {
    
    --bg0: #0e0f11;
    --bg1: #131417;
    --bg2: #191b1f;
    --bg3: #202329;
    --line: #23262b;
    --line-2: #363b42;
    --tx-hi: #f0f2f4;
    --tx-mid: #a9b0b8;
    --tx-lo: #747b84;

    
    --danger: #e5646a;

    
    --radius-l: 12px;
    --radius-m: 10px;
    --radius-s: 8px;

    
    --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;

    
    --t-fast: 130ms cubic-bezier(0.2, 0.7, 0.3, 1);
    --t-med: 200ms cubic-bezier(0.2, 0.7, 0.3, 1);

    
    --col-min: 132px;
    --strip-min: 148px;

    
    --z-chrome: 30;
    --z-player: 40;
    --z-modal: 50;
    --z-toast: 60;
}

html[data-density="compact"] { --col-min: 112px; --strip-min: 128px; }
html[data-density="tight"]   { --col-min: 94px;  --strip-min: 110px; }

* { box-sizing: border-box; }

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    background-color: var(--bg0);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.45;
    color: var(--tx-hi);
    -webkit-font-smoothing: antialiased;
}

body::before,
body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-color: var(--bg0);
    background-image:
        linear-gradient(to right, rgba(255, 255, 255, .028) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, .028) 1px, transparent 1px);
    background-size: 28px 28px;
}

body::after {
    background-color: transparent;
    background-image:
        linear-gradient(to right, rgba(255, 255, 255, .075) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, .075) 1px, transparent 1px);
    opacity: 0;
    transition: opacity 500ms ease;
    -webkit-mask-image: radial-gradient(260px circle at var(--mx, -500px) var(--my, -500px), #000 0%, transparent 72%);
    mask-image: radial-gradient(260px circle at var(--mx, -500px) var(--my, -500px), #000 0%, transparent 72%);
}

body.spotlight::after { opacity: 1; }

button, input, select { font: inherit; color: inherit; }button { cursor: pointer; }

[hidden] { display: none !important; }

::selection { background: #3a4048; color: var(--tx-hi); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
    background: var(--bg3);
    border-radius: 999px;
    border: 2px solid var(--bg0);
}
::-webkit-scrollbar-thumb:hover { background: var(--line-2); }

:focus-visible {
    outline: 2px solid var(--tx-hi);
    outline-offset: 2px;
    border-radius: 4px;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: var(--z-chrome);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(14, 15, 17, .72);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 8px 28px rgba(0, 0, 0, .32);
}

.brand {
    flex: 0 1 auto;
    min-width: 0;
}

.brand h1 {
    margin: 0;
    font-size: clamp(22px, 2.6vw, 34px);
    font-weight: 700;
    letter-spacing: -.03em;
    text-transform: lowercase;
    cursor: pointer;
    line-height: 1.05;
    white-space: nowrap;
    transition: opacity var(--t-fast);
}
.brand h1:hover { opacity: .82; }

#slogan {
    display: block;
    margin-top: 4px;
    padding: 0;
    border: 0;
    background: none;
    text-align: left;
    width: 100%;
    min-height: 17px;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.5;
    color: var(--tx-lo);
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    transition: color var(--t-fast);
}
#slogan:hover { color: var(--tx-mid); }

.searchWrap {
    position: relative;
    flex: 0 1 460px;
    min-width: 140px;
    margin-inline: auto; 
}

.searchIcon {
    position: absolute;
    left: 12px;
    top: 50%;
    width: 15px;
    height: 15px;
    transform: translateY(-50%);
    fill: none;
    stroke: var(--tx-lo);
    stroke-width: 2;
    stroke-linecap: round;
    pointer-events: none;
}

#search {
    width: 100%;
    height: 42px;
    padding: 0 64px 0 38px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg1);
    color: var(--tx-hi);
    transition: border-color var(--t-fast), background-color var(--t-fast), box-shadow var(--t-fast);
}
#search::placeholder { color: var(--tx-lo); transition: color var(--t-fast); }
#search:hover {
    border-color: var(--line-2);
    background: var(--bg2);
    box-shadow: 0 2px 12px rgba(0, 0, 0, .25);
}
#search:hover::placeholder { color: var(--tx-mid); }
.searchWrap:hover .kbdHint { color: var(--tx-mid); border-color: var(--line-2); }
#search:focus { outline: none; border-color: var(--tx-mid); }
#search:focus-visible { outline: none; } 

.kbdHint {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    padding: 1px 7px;
    border: 1px solid var(--line);
    border-radius: 5px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--tx-lo);
    pointer-events: none;
}
.searchWrap.has-value .kbdHint { display: none; }

#clearSearch {
    position: absolute;
    right: 9px;
    top: 50%;
    transform: translateY(-50%) scale(.6);
    display: none;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: none;
    color: var(--tx-lo);
    font-size: 17px;
    line-height: 1;
    opacity: 0;
    transition: color var(--t-fast), background-color var(--t-fast), opacity var(--t-fast), transform var(--t-fast);
}
#clearSearch:hover { color: var(--tx-hi); background: var(--bg3); }
.searchWrap.has-value #clearSearch {
    display: flex;
    opacity: 1;
    transform: translateY(-50%) scale(1);
}

.topSelects {
    display: flex;
    gap: 8px;
    flex: 0 0 auto;
}

.selectWrap {
    position: relative;
    display: inline-flex;
}

.selectWrap .chevron {
    position: absolute;
    right: 10px;
    top: 50%;
    width: 14px;
    height: 14px;
    transform: translateY(-50%) rotate(0deg);
    fill: none;
    stroke: var(--tx-lo);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
    transition: transform var(--t-fast), stroke var(--t-fast);
}
.selectWrap:focus-within .chevron {
    transform: translateY(-50%) rotate(180deg);
    stroke: var(--tx-hi);
}

select {
    width: 100%;
    height: 42px;
    padding: 0 32px 0 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    background: var(--bg1);
    appearance: none;
    -webkit-appearance: none;
    color: var(--tx-mid);
    cursor: pointer;
    transition: border-color var(--t-fast), color var(--t-fast), transform var(--t-fast);
}
select:hover { border-color: var(--line-2); color: var(--tx-hi); }
select:focus { outline: none; border-color: var(--tx-mid); }
select:active { transform: scale(.985); }
#sort { min-width: 118px; }
#tagFilter { max-width: 150px; }

.iconBtn {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    background: var(--bg1);
    color: var(--tx-mid);
    transition: border-color var(--t-fast), color var(--t-fast), background-color var(--t-fast);
}
.iconBtn svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 340ms cubic-bezier(0.2, 0.7, 0.3, 1);
}
.iconBtn:hover { border-color: var(--line-2); color: var(--tx-hi); background: var(--bg2); }
.iconBtn:hover svg { transform: rotate(90deg); }
.iconBtn:active { background: var(--bg3); }
.iconBtn:active svg { transform: rotate(90deg) scale(.9); }

main {
    padding: 20px 22px 110px;
}

.statusRow {
    margin-bottom: 18px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--tx-lo);
}

#gameCount {
    color: var(--tx-mid);
    text-decoration: underline;
    text-decoration-color: var(--tx-lo);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
}

section { margin-bottom: 30px; }

.secHead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
}

.secLabel {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -.01em;
    text-transform: lowercase;
}

.chip {
    padding: 2px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--tx-lo);
}
.chip:empty { display: none; }

.loadNote {
    padding: 14px 2px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--tx-lo);
}

.emptyState {
    padding: 56px 16px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--tx-lo);
}

.pillRow {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
}

.pillRow button {
    flex: 0 0 auto;
    max-width: 220px;
    padding: 7px 13px;
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    background: var(--bg1);
    color: var(--tx-mid);
    font-size: 12.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: border-color var(--t-fast), color var(--t-fast), transform var(--t-fast);
}
.pillRow button:hover { border-color: var(--line-2); color: var(--tx-hi); transform: translateY(-1px); }
.pillRow button:active { transform: translateY(0); }

.cardGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--col-min), 1fr));
    gap: 10px;
}

.cardStrip {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: clamp(var(--strip-min), 22vw, 200px);
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
}

.card {
    position: relative;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    background: var(--bg1);
    overflow: hidden;
    cursor: pointer;
    transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(0) scale(1);
    transition: border-color var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast);
}

.card:hover {
    border-color: var(--line-2);
    transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(-3px) scale(1.015);
    box-shadow: 0 10px 26px rgba(0, 0, 0, .38);
}

.card:active {
    transform: perspective(700px) rotateX(0deg) rotateY(0deg) translateY(-1px) scale(.995);
    box-shadow: none;
}

.card.enter {
    animation: cardIn 240ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
    animation-delay: calc(min(var(--i, 0), 12) * 22ms);
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(10px) scale(1); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

.thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--bg2);
    isolation: isolate;
    overflow: hidden;
}

.thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transform: scale(1);
    transition: opacity var(--t-med), transform var(--t-med);
}
.thumb img.loaded { opacity: 1; animation: none; }
.card:hover .thumb img.loaded { transform: scale(1.05); }

.starBtn {
    position: absolute;
    top: 6px;
    right: 6px;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 1px solid var(--line-2);
    border-radius: 999px;
    background: rgba(14, 15, 17, .78);
    color: var(--tx-mid);
    opacity: 0;
    transition: opacity var(--t-fast), color var(--t-fast), border-color var(--t-fast), background-color var(--t-fast);
}

.starBtn svg {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linejoin: round;
}

.card:hover .starBtn,
.card:focus-within .starBtn,
.starBtn.active { opacity: 1; }

.starBtn:hover { color: var(--tx-hi); border-color: var(--tx-mid); }
.starBtn:active { transform: scale(.94); }

.starBtn.active {
    background: var(--tx-hi);
    border-color: var(--tx-hi);
    color: var(--bg0);
    animation: starPop 240ms cubic-bezier(0.2, 0.7, 0.3, 1);
}
.starBtn.active svg { fill: currentColor; }

@keyframes starPop {
    0%   { transform: scale(.8); }
    55%  { transform: scale(1.22); }
    100% { transform: scale(1); }
}

.cBody {
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 8px 10px 9px;
    min-width: 0;
}

.cTitle {
    font-size: 13px;
    font-weight: 500;
    color: var(--tx-hi);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color var(--t-fast);
}
.card:hover .cTitle { color: #ffffff; }

.cMeta {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--tx-lo);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.skeletonCard { pointer-events: none; }
.skeletonCard .thumb { background: var(--bg2); }
.skeletonCard .skeletonLine {
    height: 10px;
    margin: 9px 10px;
    border-radius: 4px;
    background: var(--bg2);
}
.skeletonCard .skeletonLine.short { width: 55%; }

.diceFab {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: var(--z-chrome);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    padding: 0;
    border: 1px solid var(--line-2);
    border-radius: 999px;
    background: var(--bg2);
    color: var(--tx-hi);
    box-shadow: 0 8px 22px rgba(0, 0, 0, .45);
    transition: transform var(--t-fast), border-color var(--t-fast), background-color var(--t-fast);
}
.diceFab svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 560ms cubic-bezier(0.2, 0.7, 0.3, 1);
}
.diceFab:hover { background: var(--bg3); border-color: var(--tx-lo); transform: scale(1.06); }
.diceFab:hover svg { transform: rotate(360deg); }
.diceFab:active { transform: scale(.97); }
.diceFab.shake { animation: diceShake 420ms cubic-bezier(0.36, 0.07, 0.19, 0.97); }

@keyframes diceShake {
    0%   { transform: scale(1.06) rotate(0deg); }
    25%  { transform: translate(-3px, 1px) rotate(-9deg); }
    50%  { transform: translate(3px, -1px) rotate(9deg); }
    75%  { transform: translate(-2px, 0) rotate(-4deg); }
    100% { transform: scale(1.06) rotate(0deg); }
}

.backFab {
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: var(--z-chrome);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    padding: 0;
    border: 1px solid var(--line-2);
    border-radius: 999px;
    background: var(--bg1);
    color: var(--tx-mid);
    opacity: 0;
    pointer-events: none;
    transform: translateY(30px) scale(.92);
    transition:
        opacity 340ms cubic-bezier(0.2, 0.7, 0.3, 1),
        transform 340ms cubic-bezier(0.2, 0.7, 0.3, 1),
        border-color var(--t-fast),
        color var(--t-fast),
        background-color var(--t-fast);
}
.backFab svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.backFab.show { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
.backFab:hover { color: var(--tx-hi); border-color: var(--tx-lo); background: var(--bg2); }
.backFab:active { transform: translateY(-2px) scale(1); }

#player {
    position: fixed;
    inset: 0;
    z-index: var(--z-player);
    display: none;
    flex-direction: column;
    background: var(--bg0);
    isolation: isolate;
}
#player.active { display: flex; }

.playerBar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--bg1);
}

.pInfo { flex: 1 1 auto; min-width: 0; }

#gameName {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.2;
    overflow: hidden;
    overflow-wrap: anywhere;
}

#gameMeta {
    margin-top: 1px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--tx-lo);
    overflow: hidden;
    overflow-wrap: anywhere;
}

.pActions { display: flex; gap: 6px; flex: 0 0 auto; }

.pBtn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 11px;
    border: 1px solid var(--line);
    border-radius: var(--radius-s);
    background: var(--bg1);
    color: var(--tx-mid);
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    transition: border-color var(--t-fast), color var(--t-fast), background-color var(--t-fast);
}
.pBtn svg {
    width: 13px;
    height: 13px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: 0 0 auto;
}
.pBtn:hover { border-color: var(--line-2); color: var(--tx-hi); background: var(--bg2); }
.pBtn:active { background: var(--bg3); }

.pBtn.saved {
    background: var(--tx-hi);
    border-color: var(--tx-hi);
    color: var(--bg0);
}
.pBtn.saved svg { fill: currentColor; }

.pIconBtn { padding: 9px; }

#gameFrame {
    flex: 1;
    width: 100%;
    border: 0;
    background: #101113;
}

#modalOverlay,
#announceOverlay,
#idiotOverlay {
    position: fixed;
    inset: 0;
    z-index: var(--z-modal);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(8, 9, 10, .68);
    isolation: isolate;
}
#modalOverlay.active,
#announceOverlay.active,
#idiotOverlay.active { display: flex; }

.modal {
    width: min(520px, 100%);
    max-height: min(640px, calc(100vh - 48px));
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    border-radius: var(--radius-l);
    background: var(--bg1);
    box-shadow: 0 18px 48px rgba(0, 0, 0, .5);
    overflow: hidden;
}

.modalHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
}
.modalHeader h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    text-transform: lowercase;
}

#modalClose,
#idiotClose,
#announceClose {
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: none;
    color: var(--tx-mid);
    font-size: 17px;
    line-height: 1;
    transition: border-color var(--t-fast), color var(--t-fast), background-color var(--t-fast);
}
#modalClose:hover,
#idiotClose:hover,
#announceClose:hover { border-color: var(--line-2); color: var(--tx-hi); background: var(--bg2); }

.modalBody {
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
    color: var(--tx-mid);
}

#announceText {
    margin: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.6;
    text-align: center;
    font-weight: 600;
    color: var(--tx-hi);
}

#announceOverlay .modalBody { align-items: center; }

#announceDismiss {
    width: auto;
    min-width: 200px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 13px;
}

#announceClose.spin { animation: xSpin 380ms cubic-bezier(0.2, 0.7, 0.3, 1) both; }

@keyframes xSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

.idiotBody { align-items: center; text-align: center; }

#idiotText {
    margin: 6px 0 4px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -.02em;
    color: var(--tx-hi);
}

.idiotBtns {
    display: flex;
    gap: 10px;
    justify-content: center;
    width: 100%;
    margin-top: 8px;
}

.idiotBtns button {
    width: auto;
    min-width: 140px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 13px;
}

.idiotBtns .wideButton.yes {
    background: var(--tx-hi);
    border-color: var(--tx-hi);
    color: var(--bg0);
}
.idiotBtns .wideButton.yes:hover { background: #dfe3e7; }

#idiotNo.flip { animation: starPop 200ms cubic-bezier(0.2, 0.7, 0.3, 1); }

.setGroup {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.setLabel {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--tx-lo);
}

.setGroup select {
    width: 100%;
    height: 42px;
    background-color: var(--bg0);
}

.wideButton {
    width: 100%;
    min-height: 42px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    background: var(--bg0);
    color: var(--tx-mid);
    text-align: left;
    font-weight: 500;
    transition: border-color var(--t-fast), color var(--t-fast), background-color var(--t-fast);
}
.wideButton:hover { border-color: var(--line-2); color: var(--tx-hi); background: var(--bg2); }
.wideButton:active { background: var(--bg3); }
.wideButton.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 34%, var(--line)); }
.wideButton.danger:hover { border-color: var(--danger); color: #f08a8f; }

.settingsGrid {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.setDivider { border: 0; border-top: 1px solid var(--line); margin: 0; }

#toast {
    position: fixed;
    left: 50%;
    bottom: 88px;
    transform: translateX(-50%) translateY(8px);
    z-index: var(--z-toast);
    padding: 9px 15px;
    border: 1px solid var(--line-2);
    border-radius: 999px;
    background: var(--bg2);
    color: var(--tx-hi);
    font-family: var(--font-mono);
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--t-fast), transform var(--t-fast);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        transition-duration: 1ms !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
    }
    .card:hover { transform: none; }
}

html[data-motion="reduced"] *,
html[data-motion="reduced"] *::before,
html[data-motion="reduced"] *::after {
    transition-duration: 1ms !important;
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
}
html[data-motion="reduced"] .card:hover { transform: translateY(-2px); }

@media (min-width: 1150px) {
    .searchWrap {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        flex: 0 0 auto;
        width: clamp(280px, 30vw, 470px);
        margin: 0;
    }
    .topSelects { margin-left: auto; }
}

@media (max-width: 900px) {
    .topbar { flex-wrap: wrap; padding: 12px 14px; row-gap: 10px; }
    .brand { flex-basis: 100%; min-width: 0; }
    .brand h1 { font-size: clamp(22px, 6vw, 28px); white-space: normal; overflow-wrap: anywhere; }
    .searchWrap { order: 2; flex: 1 1 auto; margin-inline: 0; }
    .topSelects { order: 3; flex: 1 1 auto; }
    .topSelects select { flex: 1 1 auto; min-width: 0; }
    .iconBtn { order: 4; }
    main { padding: 14px 14px 104px; }

    .diceFab { width: 46px; height: 46px; right: 14px; bottom: 14px; }
    #toast { bottom: 76px; }

    .playerBar { flex-wrap: wrap; }
    .pInfo { flex-basis: calc(100% - 44px); }
    .pActions { flex-basis: 100%; }
    .pActions .pBtn { flex: 1 1 auto; justify-content: center; }
}

</style>
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <h1 id="siteTitle" role="button" tabindex="0">classroommaxxing v6</h1>
            <button id="slogan" type="button"></button>
        </div>

        <div class="searchWrap">
            <svg class="searchIcon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="search" placeholder="search games" autocomplete="off" spellcheck="false"
                aria-label="search games" />
            <span id="searchKbd" class="kbdHint" aria-hidden="true">/</span>
            <button id="clearSearch" type="button" aria-label="clear search">&times;</button>
        </div>

        <div class="topSelects">
            <span class="selectWrap">
                <select id="sort" aria-label="sort games">
                    <option value="name">name</option>
                    <option value="newest">newest</option>
                    <option value="oldest">oldest</option>
                </select>
                <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
            <span class="selectWrap">
                <select id="tagFilter" aria-label="filter by tag">
                    <option value="">all tags</option>
                </select>
                <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
        </div>

        <button id="settingsButton" class="iconBtn" type="button" aria-label="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
    </header>

    <main id="main">
        <div class="statusRow">
            <span id="gameCount">loading games...</span>
        </div>

        <section id="recentSection" hidden>
            <div class="secHead"><span class="secLabel">recently played</span></div>
            <div id="recent" class="pillRow"></div>
        </section>

        <section id="favoritesStrip" hidden>
            <div class="secHead"><span class="secLabel">favorites</span><span id="favoritesCount" class="chip"></span></div>
            <div id="favorites" class="cardStrip"></div>
        </section>

        <section id="gridSection">
            <div class="secHead"><span class="secLabel">all games</span><span id="gridNote" class="chip"></span></div>
            <div id="grid" class="cardGrid"></div>
            <div id="loader" class="loadNote">loading...</div>
            <div id="emptyState" class="emptyState" hidden></div>
        </section>
    </main>

    <button id="backUp" class="backFab" type="button" aria-label="back to top">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    </button>

    <button id="randomGame" class="diceFab" type="button" aria-label="open a random game" title="random game">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
    </button>

    <div id="player" aria-hidden="true">
        <div class="playerBar">
            <button id="closeGame" class="pBtn pIconBtn" type="button" aria-label="close game" title="close (or hold esc)">
                <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <div class="pInfo">
                <h2 id="gameName">game</h2>
                <div id="gameMeta">loading...</div>
            </div>
            <div class="pActions">
                <button id="saveGame" class="pBtn" type="button" aria-label="save to favorites">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    <span>save</span>
                </button>
                <button id="reloadGame" class="pBtn" type="button" aria-label="reload game">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    <span>reload</span>
                </button>
                <button id="shareGame" class="pBtn" type="button" aria-label="copy link to this game">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                    <span>link</span>
                </button>
                <button id="newTabGame" class="pBtn" type="button" aria-label="open in new tab">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    <span>new tab</span>
                </button>
                <button id="fullscreenGame" class="pBtn" type="button" aria-label="fullscreen">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                    <span>fullscreen</span>
                </button>
            </div>
        </div>
        <iframe id="gameFrame" title="Game"></iframe>
    </div>

    <div id="announceOverlay" role="dialog" aria-modal="true" aria-labelledby="announceTitle">
        <div class="modal">
            <div class="modalHeader">
                <h2 id="announceTitle">announcement</h2>
                <button id="announceClose" type="button" aria-label="dismiss announcement">&times;</button>
            </div>
            <div class="modalBody">
                <p id="announceText"></p>
                <button id="announceDismiss" class="wideButton" type="button">got it!</button>
            </div>
        </div>
    </div>

    <div id="idiotOverlay" role="dialog" aria-modal="true" aria-labelledby="idiotTitle">
        <div class="modal">
            <div class="modalHeader">
                <h2 id="idiotTitle">?</h2>
                <button id="idiotClose" type="button" aria-label="close">&times;</button>
            </div>
            <div class="modalBody idiotBody">
                <p id="idiotText">are you sure?</p>
                <div class="idiotBtns">
                    <button id="idiotYes" class="wideButton yes" type="button">yes</button>
                    <button id="idiotNo" class="wideButton" type="button">no</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <div class="modalHeader">
                <h2 id="modalTitle">settings</h2>
                <button id="modalClose" type="button" aria-label="close settings">&times;</button>
            </div>
            <div id="modalBody" class="modalBody"></div>
        </div>
    </div>

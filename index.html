    <style>


:root {
    color-scheme: dark;
    
    --bg0: #0e0f11;
    --bg1: #131417;
    --bg2: #191b1f;
    --bg3: #202329;
    --line: #23262b;
    --line-2: #363b42;
    --tx-hi: #f0f2f4;
    --tx-mid: #a9b0b8;
    --tx-lo: #747b84;

    
    --danger: #e5646a;

    
    --radius-l: 12px;
    --radius-m: 10px;
    --radius-s: 8px;

    
    --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;

    
    --t-fast: 130ms cubic-bezier(0.2, 0.7, 0.3, 1);
    --t-med: 200ms cubic-bezier(0.2, 0.7, 0.3, 1);

    
    --col-min: 132px;
    --strip-min: 148px;

    
    --z-chrome: 30;
    --z-player: 40;
    --z-modal: 50;
    --z-toast: 60;
}

html[data-density="compact"] { --col-min: 112px; --strip-min: 128px; }
html[data-density="tight"]   { --col-min: 94px;  --strip-min: 110px; }

* { box-sizing: border-box; }

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    background-color: var(--bg0);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.45;
    color: var(--tx-hi);
    -webkit-font-smoothing: antialiased;
}


body::before,
body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-color: var(--bg0);
    background-image:
        linear-gradient(to right, rgba(255, 255, 255, .028) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, .028) 1px, transparent 1px);
    background-size: 28px 28px;
}

body::after {
    background-color: transparent;
    background-image:
        linear-gradient(to right, rgba(255, 255, 255, .075) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, .075) 1px, transparent 1px);
    opacity: 0;
    transition: opacity 500ms ease;
    -webkit-mask-image: radial-gradient(260px circle at var(--mx, -500px) var(--my, -500px), #000 0%, transparent 72%);
    mask-image: radial-gradient(260px circle at var(--mx, -500px) var(--my, -500px), #000 0%, transparent 72%);
}

body.spotlight::after { opacity: 1; }

button, input, select { font: inherit; color: inherit; }
button {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
}

[hidden] { display: none !important; }

::selection { background: #3a4048; color: var(--tx-hi); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
    background: var(--bg3);
    border-radius: 999px;
    border: 2px solid var(--bg0);
}
::-webkit-scrollbar-thumb:hover { background: var(--line-2); }

:focus-visible {
    outline: 2px solid var(--tx-hi);
    outline-offset: 2px;
    border-radius: 4px;
}



.topbar {
    position: sticky;
    top: 0;
    z-index: var(--z-chrome);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(14, 15, 17, .72);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 8px 28px rgba(0, 0, 0, .32);
}

.brand {
    flex: 0 1 auto;
    min-width: 0;
}

.brand h1 {
    margin: 0;
    font-size: clamp(22px, 2.6vw, 34px);
    font-weight: 700;
    letter-spacing: -.03em;
    text-transform: lowercase;
    cursor: pointer;
    line-height: 1.05;
    white-space: nowrap;
    transition: opacity var(--t-fast);
}
.brand h1:hover { opacity: .82; }

#slogan {
    display: block;
    margin-top: 4px;
    padding: 0;
    border: 0;
    background: none;
    text-align: left;
    width: 100%;
    min-height: 17px;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.5;
    color: var(--tx-lo);
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    transition: color var(--t-fast);
}
#slogan:hover { color: var(--tx-mid); }

.searchWrap {
    position: relative;
    flex: 0 1 460px;
    min-width: 140px;
    margin-inline: auto; 
}

.searchIcon {
    position: absolute;
    left: 12px;
    top: 50%;
    width: 15px;
    height: 15px;
    transform: translateY(-50%);
    fill: none;
    stroke: var(--tx-lo);
    stroke-width: 2;
    stroke-linecap: round;
    pointer-events: none;
}

#search {
    width: 100%;
    height: 42px;
    padding: 0 64px 0 38px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg1);
    color: var(--tx-hi);
    transition: border-color var(--t-fast), background-color var(--t-fast), box-shadow var(--t-fast);
}
#search::placeholder { color: var(--tx-lo); transition: color var(--t-fast); }
#search:hover {
    border-color: var(--line-2);
    background: var(--bg2);
    box-shadow: 0 3px 18px rgba(0, 0, 0, .35), 0 0 0 2px rgba(169, 176, 184, .07);
}
.searchWrap:hover .searchIcon { stroke: var(--tx-hi); }
#search:hover::placeholder { color: var(--tx-mid); }
.searchWrap:hover .kbdHint { color: var(--tx-mid); border-color: var(--line-2); }
#search:focus { outline: none; border-color: var(--tx-mid); }
#search:focus-visible { outline: none; } 

.kbdHint {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    padding: 1px 7px;
    border: 1px solid var(--line);
    border-radius: 5px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--tx-lo);
    pointer-events: none;
}
.searchWrap.has-value .kbdHint { display: none; }

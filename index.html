    <style>


:root {
    color-scheme: dark;
    
    --bg0: #0e0f11;
    --bg1: #131417;
    --bg2: #191b1f;
    --bg3: #202329;
    --line: #23262b;
    --line-2: #363b42;
    --tx-hi: #f0f2f4;
    --tx-mid: #a9b0b8;
    --tx-lo: #747b84;

    
    --danger: #e5646a;

    
    --radius-l: 12px;
    --radius-m: 10px;
    --radius-s: 8px;

    
    --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;

    
    --t-fast: 130ms cubic-bezier(0.2, 0.7, 0.3, 1);
    --t-med: 200ms cubic-bezier(0.2, 0.7, 0.3, 1);

    
    --col-min: 132px;
    --strip-min: 148px;

    
    --z-chrome: 30;
    --z-player: 40;
    --z-modal: 50;
    --z-toast: 60;
}

html[data-density="compact"] { --col-min: 112px; --strip-min: 128px; }
html[data-density="tight"]   { --col-min: 94px;  --strip-min: 110px; }

* { box-sizing: border-box; }

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    background-color: var(--bg0);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.45;
    color: var(--tx-hi);
    -webkit-font-smoothing: antialiased;
}


body::before,
body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-color: var(--bg0);
    background-image:
        linear-gradient(to right, rgba(255, 255, 255, .028) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, .028) 1px, transparent 1px);
    background-size: 28px 28px;
}

body::after {
    background-color: transparent;
    background-image:
        linear-gradient(to right, rgba(255, 255, 255, .075) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, .075) 1px, transparent 1px);
    opacity: 0;
    transition: opacity 500ms ease;
    -webkit-mask-image: radial-gradient(260px circle at var(--mx, -500px) var(--my, -500px), #000 0%, transparent 72%);
    mask-image: radial-gradient(260px circle at var(--mx, -500px) var(--my, -500px), #000 0%, transparent 72%);
}

body.spotlight::after { opacity: 1; }

button, input, select { font: inherit; color: inherit; }
button {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
}

[hidden] { display: none !important; }

::selection { background: #3a4048; color: var(--tx-hi); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
    background: var(--bg3);
    border-radius: 999px;
    border: 2px solid var(--bg0);
}
::-webkit-scrollbar-thumb:hover { background: var(--line-2); }

:focus-visible {
    outline: 2px solid var(--tx-hi);
    outline-offset: 2px;
    border-radius: 4px;
}



.topbar {
    position: sticky;
    top: 0;
    z-index: var(--z-chrome);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(14, 15, 17, .72);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 8px 28px rgba(0, 0, 0, .32);
}

.brand {
    flex: 0 1 auto;
    min-width: 0;
}

.brand h1 {
    margin: 0;
    font-size: clamp(22px, 2.6vw, 34px);
    font-weight: 700;
    letter-spacing: -.03em;
    text-transform: lowercase;
    cursor: pointer;
    line-height: 1.05;
    white-space: nowrap;
    transition: opacity var(--t-fast);
}
.brand h1:hover { opacity: .82; }

#slogan {
    display: block;
    margin-top: 4px;
    padding: 0;
    border: 0;
    background: none;
    text-align: left;
    width: 100%;
    min-height: 17px;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.5;
    color: var(--tx-lo);
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    transition: color var(--t-fast);
}
#slogan:hover { color: var(--tx-mid); }

.searchWrap {
    position: relative;
    flex: 0 1 460px;
    min-width: 140px;
    margin-inline: auto; 
}

.searchIcon {
    position: absolute;
    left: 12px;
    top: 50%;
    width: 15px;
    height: 15px;
    transform: translateY(-50%);
    fill: none;
    stroke: var(--tx-lo);
    stroke-width: 2;
    stroke-linecap: round;
    pointer-events: none;
}

#search {
    width: 100%;
    height: 42px;
    padding: 0 64px 0 38px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg1);
    color: var(--tx-hi);
    transition: border-color var(--t-fast), background-color var(--t-fast), box-shadow var(--t-fast);
}
#search::placeholder { color: var(--tx-lo); transition: color var(--t-fast); }
#search:hover {
    border-color: var(--line-2);
    background: var(--bg2);
    box-shadow: 0 3px 18px rgba(0, 0, 0, .35), 0 0 0 2px rgba(169, 176, 184, .07);
}
.searchWrap:hover .searchIcon { stroke: var(--tx-hi); }
#search:hover::placeholder { color: var(--tx-mid); }
.searchWrap:hover .kbdHint { color: var(--tx-mid); border-color: var(--line-2); }
#search:focus { outline: none; border-color: var(--tx-mid); }
#search:focus-visible { outline: none; } 

.kbdHint {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    padding: 1px 7px;
    border: 1px solid var(--line);
    border-radius: 5px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--tx-lo);
    pointer-events: none;
}
.searchWrap.has-value .kbdHint { display: none; }

.iconBtn {

main {

.cardGrid {

}

.cardStrip {

}

.card {
    position: relative;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    background: var(--bg1);
    overflow: hidden;
    cursor: pointer;
    transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(0) scale(1);
    transition: border-color var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast);
}

.card:hover {
    border-color: var(--line-2);
    transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(-3px) scale(1.015);
    box-shadow: 0 10px 26px rgba(0, 0, 0, .38);
}

.card:active {
    transform: perspective(700px) rotateX(0deg) rotateY(0deg) translateY(-1px) scale(.995);

}


.card.enter {
    animation: cardIn 240ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
    animation-delay: calc(min(var(--i, 0), 12) * 22ms);
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(10px) scale(1); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

.thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--bg2);
    isolation: isolate;
    overflow: hidden;
}

.thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;

    opacity: 0;
    transform: scale(1);

}

.starBtn {

}

.starBtn svg {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linejoin: round;
}

.card:hover .starBtn,
.card:focus-within .starBtn,

.starBtn:hover { color: var(--tx-hi); border-color: var(--tx-mid); }
.starBtn:active { transform: scale(.94); }

.starBtn.active {
    background: var(--tx-hi);

    color: var(--bg0);

}

    55%  { transform: scale(1.22); }

}

.cBody {

}

}

.backFab {

#player {

.pBtn {

.pBtn:hover { border-color: var(--line-2); color: var(--tx-hi); background: var(--bg2); }

.pBtn.saved {

.pIconBtn { padding: 9px; }

#gameFrame {

#modalOverlay,
#announceOverlay,
#idiotOverlay {
    position: fixed;

.modalHeader {

.idiotBody { align-items: center; text-align: center; }

.setGroup {

.setLabel {

.settingsGrid {

#toast {

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        transition-duration: 0s !important;
        animation: none !important;
        scroll-behavior: auto !important;
    }
    .card, .card:hover, .card:active, .card:hover .thumb img.loaded,
    .iconBtn svg, .starBtn:active, .diceFab, .diceFab:hover svg,
    .pillRow button:hover, .pillRow button:active, .backFab.show:active { transform: none !important; }
}

html[data-motion="reduced"] *,
html[data-motion="reduced"] *::before,
html[data-motion="reduced"] *::after {
    transition-duration: 0s !important;
    animation: none !important;
    scroll-behavior: auto !important;
}
html[data-motion="reduced"] :is(.card, .card:hover, .card:active, .card:hover .thumb img.loaded,
.iconBtn svg, .starBtn:active, .diceFab, .diceFab:hover svg,
.pillRow button:hover, .pillRow button:active, .backFab.show:active) { transform: none !important; }


@media (min-width: 1150px) {
    .searchWrap {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        flex: 0 0 auto;
        width: clamp(280px, 30vw, 470px);

    .pActions { flex-wrap: wrap; }
    .wideButton { padding: 9px 12px; }
    .topSelects select { height: 38px; }

    .brand { flex-basis: 100%; min-width: 0; }
    .brand h1 { font-size: clamp(22px, 6vw, 28px); white-space: normal; overflow-wrap: anywhere; }
    .searchWrap { order: 2; flex: 1 1 auto; margin-inline: 0; }
    .topSelects { order: 3; flex: 1 1 auto; }
    .topSelects select { flex: 1 1 auto; min-width: 0; }
    .iconBtn { order: 4; }
    main { padding: 14px 14px 104px; }

    .diceFab { width: 46px; height: 46px; right: 14px; bottom: 14px; }
    #toast { bottom: 76px; }

    .playerBar { flex-wrap: wrap; }
    .pInfo { flex-basis: calc(100% - 44px); }
    .pActions { flex-basis: 100%; }
    .pActions .pBtn { flex: 1 1 auto; justify-content: center; }
}

.setGroup + .setGroup { margin-top: 10px; }
.setLabel { font-family: var(--font-sans); font-size: 13px; font-weight: 500; text-transform: none; letter-spacing: normal; color: var(--tx-mid); }

@keyframes actionPop { 50% { transform: scale(1.18); } }
@keyframes actionTurn { to { transform: rotate(360deg); } }
.actionFeedback svg { animation: actionPop 300ms ease; }

html[data-motion="reduced"] .actionFeedback svg, html[data-motion="reduced"] .actionLoading svg { animation: none; }
@media (prefers-reduced-motion: reduce) { .actionFeedback svg, .actionLoading svg { animation: none; } }
body.inverted { overflow: hidden; }
.invertedShell { position: fixed; inset: 0; height: 100dvh; transform: rotate(180deg); background: var(--bg0); z-index: 1; }
.invertedScroll { height: 100%; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }

#presentationShell:not(.invertedShell), #presentationScroll:not(.invertedScroll) { display: contents; }

</style>
</head>

<body>
    <div id="presentationShell">
    <div id="presentationScroll">
    <header class="topbar">
        <div class="brand">
            <h1 id="siteTitle" role="button" tabindex="0">classroommaxxing v6</h1>
            <button id="slogan" type="button"></button>
        </div>

        <div class="searchWrap">
            <svg class="searchIcon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="search" placeholder="search games" autocomplete="off" spellcheck="false"
                aria-label="search games" />
            <span id="searchKbd" class="kbdHint" aria-hidden="true">/</span>
            <button id="clearSearch" type="button" aria-label="clear search">&times;</button>
        </div>

        <div class="topSelects">
            <span class="selectWrap">
                <select id="sort" aria-label="sort games">
                    <option value="name">name</option>
                    <option value="newest">newest</option>
                    <option value="oldest">oldest</option>
                </select>
                <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
            <span class="selectWrap">
                <select id="tagFilter" aria-label="filter by tag">
                    <option value="">all tags</option>
                </select>
                <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
        </div>

        <button id="settingsButton" class="iconBtn" type="button" aria-label="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
    </header>

    <main id="main">
        <div class="statusRow">
            <span id="gameCount">loading games...</span>
        </div>

        <section id="recentSection" hidden>
            <div class="secHead"><span class="secLabel">recently played</span></div>
            <div id="recent" class="pillRow"></div>
        </section>

        <section id="favoritesStrip" hidden>
            <div class="secHead"><span class="secLabel">favorites</span><span id="favoritesCount" class="chip"></span></div>
            <div id="favorites" class="cardStrip"></div>
        </section>

        <section id="gridSection">
            <div class="secHead"><span class="secLabel">all games</span><span id="gridNote" class="chip"></span></div>
            <div id="grid" class="cardGrid"></div>
            <div id="loader" class="loadNote">loading...</div>
            <div id="emptyState" class="emptyState" hidden></div>
        </section>
    </main>
    </div>

    <button id="backUp" class="backFab" type="button" aria-label="back to top" title="back to top">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    </button>

    <button id="randomGame" class="diceFab" type="button" aria-label="open a random game" title="random game">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
    </button>

    <div id="player" aria-hidden="true">
        <div class="playerBar">
            <button id="closeGame" class="pBtn pIconBtn" type="button" aria-label="close game" title="close (or hold esc)">
                <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <div class="pInfo">
                <h2 id="gameName">game</h2>
                <div id="gameMeta">loading...</div>
            </div>
            <div class="pActions">
                <button id="saveGame" class="pBtn" type="button" aria-label="save to favorites">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    <span>save</span>
                </button>
                <button id="reloadGame" class="pBtn" type="button" aria-label="reload game">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    <span>reload</span>
                </button>
                <button id="shareGame" class="pBtn" type="button" aria-label="copy link to this game">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                    <span>link</span>
                </button>
                <button id="newTabGame" class="pBtn" type="button" aria-label="open in new tab">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    <span>new tab</span>
                </button>
                <button id="fullscreenGame" class="pBtn" type="button" aria-label="fullscreen">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                    <span>fullscreen</span>
                </button>
            </div>
        </div>
        <iframe id="gameFrame" title="Game"></iframe>
    </div>

    <div id="announceOverlay" role="dialog" aria-modal="true" aria-labelledby="announceTitle">
        <div class="modal">
            <div class="modalHeader">
                <h2 id="announceTitle">announcement</h2>
                <button id="announceClose" type="button" aria-label="dismiss announcement">&times;</button>
            </div>
            <div class="modalBody">
                <p id="announceText"></p>
                <button id="announceDismiss" class="wideButton" type="button">got it!</button>
            </div>
        </div>
    </div>

    <div id="idiotOverlay" role="dialog" aria-modal="true" aria-labelledby="idiotTitle">
        <div class="modal">
            <div class="modalHeader">
                <h2 id="idiotTitle">?</h2>
                <button id="idiotClose" type="button" aria-label="close">&times;</button>
            </div>
            <div class="modalBody idiotBody">
                <p id="idiotText">are you sure?</p>
                <div class="idiotBtns">
                    <button id="idiotYes" class="wideButton yes" type="button">yes</button>
                    <button id="idiotNo" class="wideButton" type="button">no</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <div class="modalHeader">
                <h2 id="modalTitle">settings</h2>
                <button id="modalClose" type="button" aria-label="close settings">&times;</button>
            </div>
            <div id="modalBody" class="modalBody"></div>
        </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    </div>
